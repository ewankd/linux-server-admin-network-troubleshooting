name: Python and Bash checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Bash syntax
        run: bash -n scripts/*.sh
      - name: Python syntax
        run: python3 -m compileall -q src tests
